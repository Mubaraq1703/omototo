<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarehousePro - Loading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3748;
            overflow: hidden;
        }
        
        .splash-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            animation: containerFade 0.8s ease-out;
            border: 1px solid #e2e8f0;
        }
        
        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4a5568 0%, #718096 100%);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 5px 15px rgba(74, 85, 104, 0.2);
        }
        
        .logo-text {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #2d3748;
        }
        
        .tagline {
            font-size: 18px;
            margin-bottom: 30px;
            color: #718096;
            font-weight: 400;
        }
        
        .loading-container {
            margin: 30px 0;
        }
        
        .loading-bar {
            height: 6px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4a5568, #718096);
            border-radius: 10px;
            animation: loading 3s ease-in-out infinite;
        }
        
        .loading-text {
            font-size: 14px;
            color: #718096;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin: 10px;
            font-size: 14px;
            color: #4a5568;
            background: #f7fafc;
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .feature-icon {
            margin-right: 8px;
            color: #4a5568;
        }
        
        .version {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 20px;
        }
        
        .copyright {
            font-size: 12px;
            color: #cbd5e0;
            margin-top: 10px;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        @keyframes containerFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            color: #718096;
            font-size: 12px;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        
        .stat-value {
            font-weight: 700;
            font-size: 16px;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo">
                <div class="logo-icon pulse">
                    <i class="fas fa-pallet"></i>
                </div>
                <h1 class="logo-text">OMOTOTO AGRO-ALLIED SERVICES</h1>
            </div>
        </div>
        
        <p class="tagline">Optimizing Your Supply Chain Management</p>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon"><i class="fas fa-boxes"></i></span>
                <span>Inventory Tracking</span>
            </div>
            <div class="feature">
                <span class="feature-icon"><i class="fas fa-clipboard-list"></i></span>
                <span>Order Management</span>
            </div>
            <div class="feature">
                <span class="feature-icon"><i class="fas fa-chart-line"></i></span>
                <span>Real-time Analytics</span>
            </div>
        </div>
        
        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-text">Initializing modules...</div>
        </div>

        <div class="version">Version 4.2.1</div>
        <div class="copyright">Powered by Hemdeeii Dev.</div>
    </div>

    <script>
        // Simulate loading process
        const loadingText = document.querySelector('.loading-text');
        const texts = [
            "Initializing modules...",
            "Loading inventory data...",
            "Connecting to database...",
            "Starting application...",
            "Almost ready..."
        ];
        
        let index = 0;
        let count = 0;
        
        // Change loading text every 1.5 seconds
        const textInterval = setInterval(() => {
            index = (index + 1) % texts.length;
            loadingText.textContent = texts[index];
            count++;
            
            // Stop changing text after going through all messages twice
            if (index === 0 && count > 5) {
                clearInterval(textInterval);
            }
        }, 1500);
        
        // After 6 seconds, navigate to omototo.onrender.com
        setTimeout(() => {
            loadingText.textContent = "Launching application...";
            document.querySelector('.loading-progress').style.width = "100%";
            
            // Navigate to omototo.onrender.com after a short delay
            setTimeout(() => {
                window.location.href = "https://omototo.onrender.com";
            }, 1000);
        }, 6000);
    </script>
</body>
</html>
