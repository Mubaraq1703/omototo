<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet Connection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1f5f9;
            overflow: hidden;
        }
        
        .error-container {
            background: rgba(30, 27, 75, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: containerFade 0.8s ease-out;
            border: 1px solid #4338ca;
        }
        
        .error-icon {
            font-size: 80px;
            color: #818cf8;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .error-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #e0e7ff;
        }
        
        .error-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: #c7d2fe;
            line-height: 1.6;
        }
        
        .retry-button {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }
        
        .retry-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
        }
        
        .retry-button:active {
            transform: translateY(0);
        }
        
        .version {
            font-size: 12px;
            color: #818cf8;
            margin-top: 30px;
        }
        
        @keyframes containerFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1 class="error-title">No Internet Connection</h1>
        <p class="error-message">
            It seems you're not connected to the internet. Please check your network connection and try again.
        </p>
        <button class="retry-button" onclick="retryConnection()">
            <i class="fas fa-redo"></i> Retry Connection
        </button>
        <div class="version">OMOTOTO WAREHOUSE MANAGEMENT SOFTWARE v4.2.1</div>
    </div>

    <script>
        function retryConnection() {
            // Reload the page to retry the connection
            window.location.reload();
        }
    </script>
</body>
</html>
